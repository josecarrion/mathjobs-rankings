name: Build

on:
  push:
    tags: ['v*']  # Only build on version tags
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "flet==1.1.2" "flet-cli==1.1.2" "flet-desktop==1.1.2" pyinstaller pandas numpy openpyxl

      - name: Build macOS app with flet pack
        run: |
          flet pack mathjobs_app.py \
            --name "MathJobsRankings" \
            --add-data "mathjobs_rankings_new.py:." \
            -y

      - name: Create zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MathJobsRankings.app MathJobsRankings-macOS.zip
          ls -la

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathJobsRankings-macOS
          path: dist/MathJobsRankings-macOS.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "flet==1.1.2" "flet-cli==1.1.2" "flet-desktop==1.1.2" pyinstaller pandas numpy openpyxl

      - name: Patch flet pack bug on Windows
        run: python tools/patch_flet_pack.py

      - name: Build Windows executable with flet pack
        run: |
          flet pack mathjobs_app.py `
            --name "MathJobsRankings" `
            --add-data "mathjobs_rankings_new.py;." `
            -y
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathJobsRankings-Windows
          path: dist/MathJobsRankings.exe
          if-no-files-found: error

  # Create release when a tag is pushed
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MathJobsRankings-macOS/MathJobsRankings-macOS.zip
            artifacts/MathJobsRankings-Windows/MathJobsRankings.exe
          generate_release_notes: true
